
# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        9.0

# Shell & Window Title
title            terminal

# Window Padding & Layout
window_padding_width 0
initial_window_width  700
initial_window_height 450
remember_window_size  no

# Scrollback
scrollback_lines 5000

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Mouse
mouse_hide_wait 3.0

background            #181c24
foreground            #d8dee9
cursor                #7a8ba8
background_opacity    0.92
window_padding_width  0
cursor             #ffffff
cursor_text_color  #000000

# Window Decorations & Borders
hide_window_decorations yes
window_border_width     0pt

# Normal Monochrome Palette
color0  #000000
color1  #ffffff
color2  #ffffff
color3  #ffffff
color4  #ffffff
color5  #ffffff
color6  #ffffff
color7  #ffffff

# Bright Monochrome Palette
color8  #555555
color9  #ffffff
color10 #ffffff
color11 #ffffff
color12 #ffffff
color13 #ffffff
color14 #ffffff
color15 #ffffff
