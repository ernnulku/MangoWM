font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        9.0

# --- Window & Transparency (Lets the dunes & Death Star show through) ---
background_opacity         0.86
background_blur            16
window_padding_width       14
hide_window_decorations    yes
confirm_os_window_close    0
remember_window_size       no
initial_window_width       115c
initial_window_height      32c

# --- Borders & Layouts ---
enabled_layouts            splits,stack
window_border_width        1pt
draw_minimal_borders       yes
active_border_color        #7c98c2
inactive_border_color      #1c2738
bell_border_color          #d97777

# --- Cursor ---
cursor                     #cdd6e4
cursor_text_color          #0b111d
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_trail               3

# --- Tab Bar (Sleek Minimalist Night Sky) ---
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           1
active_tab_foreground      #0b111d
active_tab_background      #8da8cf
active_tab_font_style      bold
inactive_tab_foreground    #7c8ea8
inactive_tab_background    #151f30
inactive_tab_font_style  normal
tab_bar_background         #0b111d

# --- Color Palette (Sampled from Wallpaper + High-Contrast Accents) ---
foreground                 #d6dfed
background                 #0b111d
selection_foreground       #0b111d
selection_background       #8da8cf

# URLs
url_color                  #7aa2f7
url_style                  curly

# Black (Deep Dune Shadows)
color0                     #131b2b
color8                     #3b4b66

# Red (Subtle Crimson Accent — Laser / Alert contrast)
color1                     #d97777
color9                     #eb9494

# Green (Muted Sage — keeps cool night harmony)
color2                     #78b89b
color10                    #98d1b7

# Yellow (Warm Starlight / Sand Highlight)
color3                     #d4b483
color11                    #e6cca3

# Blue (Moonlit Slate & Midnight Sky)
color4                     #6c8ebf
color12                    #8da8cf

# Magenta (Twilight Violet-Blue)
color5                     #9a86c4
color13                    #b6a5db

# Cyan (Death Star Steel / Cool Mist)
color6                     #6ea8ba
color14                    #8ec3d4

# White (Dune Crest Highlights & Stars)
color7                     #b8c4d9
color15                    #e6edf7

# --- Behavior & Quality of Life ---
enable_audio_bell          no
copy_on_select             yes
scrollback_lines           10000
mouse_map right_click ungrabbed paste_from_clipboard
