# Mango WC Configuration

# Autostart
exec_once = mangobar
exec_once = wlr-randr --output HDMI-A-1 --mode 1920x1080@144Hz
exec_once = swaybg -i /home/eren/Downloads/wallhaven-vqwlwl.jpg

# Audio Controls (Optimized for Volume Knob / Wheel)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-source-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness Controls
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# Window Effects
blur=3
blur_layer=10
blur_optimized=1
blur_params_num_passes=5
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=10
no_radius_when_single=0

# Animation Configuration (Faster Speed)
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8

animation_duration_move=350
animation_duration_open=300
animation_duration_tag=250
animation_duration_close=400
animation_duration_focus=0

animation_curve_open=0.2,0.8,0.2,1
animation_curve_move=0.2,0.8,0.2,1
animation_curve_tag=0.2,0.8,0.2,1
animation_curve_close=0.2,0.8,0.2,1
animation_curve_focus=0.2,0.8,0.2,1
animation_curve_opacity_fade_out=0.2,0.8,0.2,1
animation_curve_opacity_fade_in=0.2,0.8,0.2,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# Keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse Settings
mouse_accel_speed = 0.5
mouse_accel_profile = 0

# Appearance & Border Colors
gap_inner_horizontal=3
gap_inner_vertical=3
gap_outer_horizontal=3
gap_outer_vertical=3
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2

root_color=0x140a0cff
border_color=0x000000ff
focus_color=0xffffffff
maximized_screen_color=0x3aa0d8ff
urgent_color=0xff5570ff
scratchpad_color=0x3aa0d8ff
global_color=0xf2e4cbff
overlay_color=0x14a57cff

# Tags & Dwindle Layout Rules
tag_num=12

tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
tag_rule=id:10,layout_name:dwindle
tag_rule=id:11,layout_name:dwindle
tag_rule=id:12,layout_name:dwindle

# Key Bindings & Apps

# Reload Config
bind=SUPER+SHIFT,r,reload_config

# Menu and Terminal
bind=SUPER,D,spawn,rofi -show drun
bind=SUPER,return,spawn,kitty

# Exit & Window Management
bind=SUPER,w,quit
bind=SUPER,Q,killclient

# Switch Focus
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# Switch Window Status & States
bind=SUPER,SPACE,togglefloating
bind=SUPER,f,togglefullscreen,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Gaps & Window Manipulation
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# Mouse & Axis & Gesture Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Layer Rules & Window Rules
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
