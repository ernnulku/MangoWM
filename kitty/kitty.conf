# Background opacity (adjust as needed, e.g., 0.5 for 50% transparency)
background_opacity 0.5

background_blur 3

# Pure Black and White Theme
background #000000
foreground #ffffff

cursor #ffffff
cursor_text_color #000000

selection_background #ffffff
selection_foreground #000000

# Monochrome Palette (Black, Grays, and White)
color0  #000000
color1  #555555
color2  #777777
color3  #999999
color4  #aaaaaa
color5  #cccccc
color6  #eeeeee
color7  #ffffff
color8  #333333
color9  #666666
color10 #888888
color11 #ababab
color12 #bcbcbc
color13 #d0d0d0
color14 #e5e5e5
color15 #ffffff

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Adjust font size as needed (default is usually 11.0 or 12.0)
font_size 10.0
