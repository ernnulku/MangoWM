# Kitty Minimal Black & White Config with 0.6 Alpha ~nyan!

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        9.0

# Shell & Window Title
shell            /bin/fish
title            terminal

# Window Padding & Layout
window_padding_width 0
initial_window_width  700
initial_window_height 450
remember_window_size  no

# Scrollback
scrollback_lines 5000

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Mouse
mouse_hide_wait 3.0

# Transparency & Background
background_opacity 0.6
background         #000000
foreground         #ffffff

# Cursor Colors (Inverted black/white block)
cursor             #ffffff
cursor_text_color  #000000

# Window Decorations & Borders
hide_window_decorations yes
window_border_width     0pt

# Normal Monochrome Palette
color0  #000000
color1  #ffffff
color2  #ffffff
color3  #ffffff
color4  #ffffff
color5  #ffffff
color6  #ffffff
color7  #ffffff

# Bright Monochrome Palette
color8  #555555
color9  #ffffff
color10 #ffffff
color11 #ffffff
color12 #ffffff
color13 #ffffff
color14 #ffffff
color15 #ffffff
