general {
    grace = 3
}

animations {
    animation = fadeOut, 0, 0, default
}

background {
    monitor =
    path = /home/eren/Downloads/wallhaven-0je31y.jpg   # <-- Change this to your image path (or use "screenshot")
    color = rgb(000000)

    # Blur is currently disabled (0). Change to 1 or 2 if you want to blur your wallpaper.
    blur_passes = 0
}

input-field {
    size = 200, 50
    outline_thickness = 2
    
    # Pure black interior with a clean white/gray border
    outer_color = rgb(ffffff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    fade_on_empty = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    text = $USER
    color = rgb(ffffff)
    font_size = 24
    font_family = Noto Sans
    shadow_passes = 0

    position = 0, 60
    halign = center
    valign = center
}

label {
    text = $TIME
    color = rgb(ffffff)
    font_size = 48
    font_family = Noto Sans
    shadow_passes = 0

    position = 0, -50
    halign = center
    valign = top
}
